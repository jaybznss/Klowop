name: Klowop
options:
  bundleIdPrefix: com.jaybznss
  deploymentTarget:
    iOS: "17.0"

packages:
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios
    from: 6.0.0

targets:
  Klowop:
    type: application
    platform: iOS
    sources:
      - Klowop
    dependencies:
      - package: LinkKit
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
    info:
      path: Klowop/Info.plist
      properties:
        CFBundleDisplayName: Klowop
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Replace YOUR_GOOGLE_CLIENT_ID with the reversed Google OAuth client id,
        # e.g. com.googleusercontent.apps.1234567890-abcdef (see SETUP.md step 3)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.YOUR_GOOGLE_CLIENT_ID

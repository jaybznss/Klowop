name: Klowop
options:
  bundleIdPrefix: com.jaybznss
  deploymentTarget:
    iOS: "26.0"

targets:
  Klowop:
    type: application
    platform: iOS
    sources:
      - Klowop
    dependencies:
      - target: KlowopWidgets
    entitlements:
      path: Klowop/Klowop.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.jaybznss.klowop
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Klowop/Info.plist
      properties:
        CFBundleDisplayName: Klowop
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.jaybznss.klowop.briefing
        NSHealthShareUsageDescription: >-
          Klowop reads your Apple Watch activity and body composition
          (weight, body fat, lean mass) to show them alongside your food log.
        NSHealthUpdateUsageDescription: >-
          Klowop saves the meals you log to Apple Health so your nutrition
          data stays in one place.
        NSCameraUsageDescription: >-
          Klowop uses the camera to scan food barcodes so you can log
          products with exact nutrition data.
        # Reversed Google OAuth iOS client ID (public, not a secret — PKCE-protected).
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.467064468765-di6kj8ltouoh029l5c2me3mfij2gr035

  KlowopWidgets:
    type: app-extension
    platform: iOS
    sources:
      - KlowopWidgets
      - Klowop/Models/Models.swift
    entitlements:
      path: KlowopWidgets/KlowopWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jaybznss.klowop
    info:
      path: KlowopWidgets/Info.plist
      properties:
        CFBundleDisplayName: Klowop
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.jaybznss.Klowop.widgets
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0

# Explicit shared scheme so `xcodegen generate` always recreates the app
# scheme (Xcode only auto-creates the extension's otherwise).
schemes:
  Klowop:
    build:
      targets:
        Klowop: all
    run:
      config: Debug
    archive:
      config: Release

